name: Sync from bar-game

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch upstream English sources
        run: |
          REPO="beyond-all-reason/Beyond-All-Reason"
          BRANCH="master"
          BASE_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/language/en"

          # bar-game owns these namespace files
          for file in features.json interface.json tips.json units.json; do
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o "/tmp/$file" "${BASE_URL}/$file")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Failed to fetch $file (HTTP $HTTP_CODE)"
              rm -f "/tmp/$file"
            fi
          done

      - name: Compare and apply changes
        id: diff
        run: |
          CHANGED=false

          for file in features.json interface.json tips.json units.json; do
            if [ -f "/tmp/$file" ]; then
              if ! diff -q "language/en/$file" "/tmp/$file" > /dev/null 2>&1; then
                CHANGED=true
                cp "/tmp/$file" "language/en/$file"
              fi
            fi
          done

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: '[bar-game] Sync English source strings'
          branch: upstream/bar-game
          title: '[bar-game] Sync English source strings'
          body: |
            Automated sync of English source files from [`beyond-all-reason/Beyond-All-Reason`](https://github.com/beyond-all-reason/Beyond-All-Reason/tree/master/language/en).

            Only game-owned namespaces are synced: `features.json`, `interface.json`, `tips.json`, `units.json`.

            ---
            *Created automatically by the upstream sync workflow. If no key deletions are detected, this PR will be auto-approved and merged.*
          labels: upstream-sync,bar-game
